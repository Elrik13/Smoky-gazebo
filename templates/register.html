{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4 card p-4 mt-5">
        <h3 class="text-center text-gold mb-4">Реєстрація у Клубі</h3>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Ім'я або Нікнейм</label>
                <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
            </div>
            <button type="submit" class="btn btn-gold w-100 mt-2">Стати членом клубу</button>
        </form>
    </div>
</div>
{% endblock %}
